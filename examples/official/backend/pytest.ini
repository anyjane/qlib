[pytest]
# pytest 配置文件
minversion = 7.0
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -v
    --strict-markers
    --tb=short
    --asyncio-mode=auto

markers =
    unit: Unit tests
    integration: Integration tests
    slow: Slow running tests
    stock: Stock module tests
    data: Data module tests
    predict: Predict module tests
    position: Position module tests
    agent: Agent module tests
    log: Log module tests

asyncio_default_fixture_loop_scope = function
